name: Daily language briefing
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,18 * * *'
  push:
    branches: [main]
    paths: ['scripts/fetch-briefing.py', '.github/workflows/briefing.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: daily-briefing
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch dated public RSS headlines
        run: python3 scripts/fetch-briefing.py
      - name: Publish headlines for Pages
        run: |
          cp public/assets/briefing.json assets/briefing.json
          git add -- public/assets/briefing.json assets/briefing.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh verified RSS briefing'
          git push
      - name: Request a Pages build for the bot commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/pages/builds',
              data=b'{}', method='POST',
              headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Pages build requested:', response.status)
          PY
